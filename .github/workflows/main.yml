name: Build nightly

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    name: Compile ROM
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Inspect Maxmod
        run: |
          find "$DEVKITPRO" -type f \( -name "maxmod.h" -o -name "*maxmod*.h" -o -name "libmm.a" \) -print
          grep -Rni "DMA\|TIMER" "$DEVKITPRO/libtonc/include" "$DEVKITPRO/libgba/include" 2>/dev/null | head -50 || true
          arm-none-eabi-nm -C "$DEVKITPRO/libgba/lib/libmm.a" | grep -Ei "dma|timer|sound|mix" | head -100 || true

      - name: Make application
        run: |
          make
      - name: Prepare for build publishing
        run: |
          mkdir -p out/rom
          cp build/gd_adv.gba out/rom
      - name: Publish build to GH Actions
        uses: actions/upload-artifact@v4
        with:
          path: out/rom
          name: gd-adv
